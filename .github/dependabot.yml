version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor
    ignore:
      - dependency-name: react-native
      - dependency-name: react-native-worklets
      - dependency-name: react-native-reanimated

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
