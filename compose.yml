services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    ports:
      - "3000:3000"
      - "12345:12345"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://alexandresilvestri@db:5432/eazybox_db
      BINDING: "0.0.0.0"
      RUBY_DEBUG_PORT: "12345"
      RUBY_DEBUG_HOST: "0.0.0.0"
    tty: true
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: alexandresilvestri
      POSTGRES_DB: eazybox_db
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandresilvestri -d eazybox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  bundle_cache:

